<!DOCTYPE html>
<!-- Strona gry; domyślny język to polski. -->
<html lang="pl">
<head>
  <!-- Kodowanie obsługujące polskie znaki. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- dopasowuje stronę gry do szerokości i skali telefonu. -->
  <!-- Ustawia nazwę „Mega parkur” widoczną na karcie przeglądarki. -->
  <title>Mega parkur</title>
  <!-- Ustawia własną ikonę platformówki na karcie przeglądarki. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Style widoku gry oraz miniatur poziomów. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- target="_top" sprawia, że menu działa również wewnątrz ramki podglądu. -->
  <a id="menu-button" class="menu-button" href="index.html" target="_top">Menu główne</a>
  <!-- Przycisk zmieniający język napisów w grze. -->
  <button id="lang-button" class="lang-button">EN</button>
  <!-- Płótno 800 x 450 pikseli, na którym JavaScript rysuje grę. -->
  <canvas id="game" width="800" height="450"></canvas>
  <div class="touch-controls" aria-label="Sterowanie dotykowe"> <!-- grupuje przyciski przeznaczone do gry na ekranie dotykowym. -->
    <button id="touch-left" type="button" aria-label="Ruch w lewo">◀</button> <!-- przytrzymanie przesuwa postać w lewo. -->
    <button id="touch-right" type="button" aria-label="Ruch w prawo">▶</button> <!-- przytrzymanie przesuwa postać w prawo. -->
    <button id="touch-jump" type="button" aria-label="Skok">▲</button> <!-- przytrzymanie pozwala wykonywać skoki. -->
  </div> <!-- kończy grupę przycisków dotykowych. -->
  <section id="victory-screen" class="victory-screen" role="dialog" aria-modal="true" aria-labelledby="victory-title" hidden> <!-- pokazuje podsumowanie dopiero po ukończeniu ostatniego poziomu. -->
    <div class="victory-card"> <!-- grupuje gratulacje, końcowy wynik i przyciski dalszych działań. -->
      <div class="victory-medal" aria-hidden="true">★</div> <!-- wyróżnia wygraną dużą złotą gwiazdą. -->
      <h1 id="victory-title"></h1> <!-- tytuł wygranej jest uzupełniany w aktualnym języku. -->
      <p id="victory-message"></p> <!-- informuje, że wszystkie poziomy zostały ukończone. -->
      <p id="victory-score" class="victory-score"></p> <!-- pokazuje łączny końcowy wynik gracza. -->
      <button id="replay-button" class="victory-button" type="button"></button> <!-- rozpoczyna nową rozgrywkę od pierwszego poziomu. -->
      <a id="victory-menu-button" class="victory-menu-button" href="index.html" target="_top"></a> <!-- wraca do menu także wtedy, gdy gra działa w ramce podglądu. -->
    </div> <!-- kończy kartę podsumowania zwycięstwa. -->
  </section> <!-- kończy pełnoekranowe podsumowanie zwycięstwa. -->
  <!-- Wczytuje logikę gry po utworzeniu elementów strony. -->
  <script src="game.js"></script>
</body>
</html>
