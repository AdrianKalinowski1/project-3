<!DOCTYPE html>
<!-- Strona gry; domyślny język to polski. -->
<html lang="pl">
<head>
  <!-- Kodowanie obsługujące polskie znaki. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- dopasowuje stronę gry do szerokości i skali telefonu. -->
  <!-- Ustawia nazwę „Mega parkur” widoczną na karcie przeglądarki. -->
  <title>Mega parkur</title>
  <!-- Ustawia własną ikonę platformówki na karcie przeglądarki. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Style widoku gry oraz miniatur poziomów. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Udostępnia zmianę wyglądu postaci i tła także podczas gry. -->
  <details id="game-appearance" class="game-appearance">
    <!-- Otwiera panel zmiany wyglądu bez zasłaniania gry, kiedy jest zamknięty. -->
    <summary id="game-appearance-toggle">🎨 Wygląd</summary>
    <!-- Grupuje wybór koloru postaci i motywu tła w małym panelu. -->
    <div class="game-appearance-panel">
      <!-- Łączy podpis z listą kolorów używaną także w menu głównym. -->
      <label for="game-player-color"><span id="game-player-color-label">Kolor postaci</span>
        <!-- Zawiera tę samą paletę kolorów, która jest zapisana w ustawieniach gry. -->
        <select id="game-player-color">
          <option value="#e94b4b">Czerwony</option>
          <option value="#3988e8">Niebieski</option>
          <option value="#38a86b">Zielony</option>
          <option value="#a65be0">Fioletowy</option>
          <option value="#f08a32">Pomarańczowy</option>
        </select>
      </label>
      <!-- Łączy podpis z listą motywów tła dostępnych w grze. -->
      <label for="game-background-theme"><span id="game-background-label">Motyw tła</span>
        <!-- Zawiera te same motywy, które można wybrać na stronie głównej. -->
        <select id="game-background-theme">
          <option value="0">Domyślny</option>
          <option value="1">Zachód słońca</option>
          <option value="2">Noc</option>
          <option value="3">Las</option>
        </select>
      </label>
      <!-- Łączy wybór muzyki z podkładem odtwarzanym podczas rozgrywki. -->
      <label for="game-music-style"><span id="game-music-label">Muzyka</span>
        <!-- Udostępnia te same autorskie style, których próbki można odsłuchać w menu głównym. -->
        <select id="game-music-style">
          <option value="adventure">Przygodowa</option>
          <option value="retro">Retro chiptune</option>
          <option value="chill">Spokojna eksploracja</option>
          <option value="arcade">Energetyczna arcade</option>
        </select>
      </label>
    </div>
  </details>
  <!-- Grupuje menu, dźwięk i język w równym pasku sterującym. -->
  <nav class="game-toolbar" aria-label="Ustawienia gry">
    <!-- target="_top" sprawia, że menu działa również wewnątrz ramki podglądu. -->
    <a id="menu-button" class="menu-button" href="index.html" target="_top">Menu główne</a>
    <!-- Pozwala włączać lub wyciszać muzykę i efekty dźwiękowe gry. -->
    <button id="audio-button" class="audio-button" type="button" aria-label="Wycisz dźwięk">🔊</button>
    <!-- Przycisk zmieniający język napisów w grze. -->
    <button id="lang-button" class="lang-button">EN</button>
  </nav>
  <!-- Płótno 800 x 450 pikseli, na którym JavaScript rysuje grę. -->
  <canvas id="game" width="800" height="450"></canvas>
  <div class="touch-controls" aria-label="Sterowanie dotykowe"> <!-- grupuje przyciski przeznaczone do gry na ekranie dotykowym. -->
    <button id="touch-left" type="button" aria-label="Ruch w lewo">◀</button> <!-- przytrzymanie przesuwa postać w lewo. -->
    <button id="touch-right" type="button" aria-label="Ruch w prawo">▶</button> <!-- przytrzymanie przesuwa postać w prawo. -->
    <button id="touch-jump" type="button" aria-label="Skok">▲</button> <!-- przytrzymanie pozwala wykonywać skoki. -->
  </div> <!-- kończy grupę przycisków dotykowych. -->
  <section id="victory-screen" class="victory-screen" role="dialog" aria-modal="true" aria-labelledby="victory-title" hidden> <!-- pokazuje podsumowanie ukończonego poziomu i dalsze działania. -->
    <div class="victory-card"> <!-- grupuje gratulacje, końcowy wynik i przyciski dalszych działań. -->
      <div class="victory-medal" aria-hidden="true">★</div> <!-- wyróżnia wygraną dużą złotą gwiazdą. -->
      <h1 id="victory-title"></h1> <!-- tytuł wygranej jest uzupełniany w aktualnym języku. -->
      <p id="victory-message"></p> <!-- informuje, że wszystkie poziomy zostały ukończone. -->
      <p id="completion-time" class="completion-stat"></p> <!-- pokazuje czas przejścia właśnie ukończonego poziomu. -->
      <p id="completion-coins" class="completion-stat"></p> <!-- pokazuje zebrane monety w ukończonym poziomie. -->
      <p id="completion-stars" class="completion-stars"></p> <!-- pokazuje gwiazdki zdobyte za monety i szybkość. -->
      <p id="completion-level-score" class="victory-score"></p> <!-- pokazuje punkty zdobyte na ukończonym poziomie. -->
      <p id="victory-score" class="victory-score completion-total" hidden></p> <!-- pokazuje łączny wynik po ukończeniu ostatniego poziomu. -->
      <button id="replay-button" class="victory-button" type="button"></button> <!-- uruchamia następny poziom albo nową grę po finale. -->
      <a id="victory-menu-button" class="victory-menu-button" href="index.html" target="_top"></a> <!-- wraca do menu także wtedy, gdy gra działa w ramce podglądu. -->
    </div> <!-- kończy kartę podsumowania zwycięstwa. -->
  </section> <!-- kończy pełnoekranowe podsumowanie zwycięstwa. -->
  <!-- Wczytuje logikę gry po utworzeniu elementów strony. -->
  <script src="music.js"></script> <!-- udostępnia wspólne motywy muzyczne właściwej grze. -->
  <script src="game.js"></script>
</body>
</html>
